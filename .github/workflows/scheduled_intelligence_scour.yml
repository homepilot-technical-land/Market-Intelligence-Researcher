name: Scheduled Market Intelligence Scour

on:
  schedule:
    # 02:00 UTC Every Morning (Nightly Developer & Portal Scour)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime ("Run on demand")
    inputs:
      max_sources:
        description: 'Maximum sources to scour in this run (leave blank for all due)'
        required: false
        default: '5'

jobs:
  scour:
    name: Execute Cloud Intelligence Scour
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Environment Diagnostics & Pre-flight Check
        run: |
          echo "=== HomePilot Market Intelligence Cloud Scour Diagnostics ==="
          if [ -z "${{ secrets.FIRECRAWL_API_KEY }}" ]; then
            echo "::warning::FIRECRAWL_API_KEY is not set in GitHub Secrets. Live Firecrawl scraping will fall back to simulation."
          else
            echo "✓ FIRECRAWL_API_KEY is set."
          fi
          if [ -z "${{ secrets.MONGODB_URI }}" ]; then
            echo "::warning::MONGODB_URI is not set in GitHub Secrets. Storage will operate using memory fallback."
          else
            echo "✓ MONGODB_URI is set."
          fi
          if [ -z "${{ secrets.XAI_API_KEY }}" ]; then
            echo "::warning::XAI_API_KEY is not set in GitHub Secrets. Grok reasoning will operate using deterministic fallback."
          else
            echo "✓ XAI_API_KEY is set."
          fi

      - name: Execute Autonomous Scour Cycle
        env:
          PYTHON_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: marketintelligenceresearch
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python cli.py run-daemon --once
