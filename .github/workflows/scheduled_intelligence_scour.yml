name: Scheduled Market Intelligence Scour

on:
  schedule:
    # 02:00 UTC Every Morning (Nightly Developer & Portal Scour)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime ("Run on demand")
    inputs:
      max_sources:
        description: 'Maximum sources to scour in this run (leave blank for all due)'
        required: false
        default: '5'

jobs:
  scour:
    name: Execute Cloud Intelligence Scour
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Scour Cycle
        env:
          PYTHON_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: marketintelligenceresearch
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          python cli.py run-daemon --once
