name: HomePilot Intelligence CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Pytest Verification & Linting
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Test Suite
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: homepilot_intelligence_test
          FIRECRAWL_API_KEY: fc-mock-ci-key
          XAI_API_KEY: xai-mock-ci-key
        run: |
          pytest tests/ -v
